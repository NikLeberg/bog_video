# SPDX-License-Identifier: MIT

adapter driver ftdi
adapter speed 30000
ftdi device_desc "Dual RS232-HS"
ftdi vid_pid 0x0403 0x6010 # FT2232
# just TCK TDI TDO TMS, no reset
ftdi layout_init 0xfff8 0xfffb
transport select jtag

# Lattice ECP5 FPGA
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME ecp5
}

# Subsidiary TAP: fpga (tap)
# LFE5U_85F has id 0x41113043
jtag newtap $_CHIPNAME tap -irlen 8 -expected-id 0x41113043

# NEORV32 target https://github.com/stnolting/neorv32
set _TARGETNAME $_CHIPNAME.neorv32_cpu
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.tap

# We use the Lattice JTAGG atom that only exposes ER1 & ER2, remap registers.
# riscv set_ir idcode <x> inaccessible, handled by fpga tap
riscv set_ir dtmcs 0x32
riscv set_ir dmi 0x38

# Shutdown OpenOCD when GDB connection terminates
$_TARGETNAME configure -event gdb-detach {shutdown}

init
halt
